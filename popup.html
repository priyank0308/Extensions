<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Duration Counter</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18243b;
      --muted: #71809a;
      --line: #e7edf5;
      --surface: #ffffff;
      --page: #f3f6fb;
      --blue: #3568e8;
      --blue-dark: #2452c7;
      --green: #15966a;
      --red: #c83d4d;
      --radius: 13px;
      --shadow: 0 3px 12px rgba(28, 48, 84, .055), 0 1px 2px rgba(28, 48, 84, .035);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 300px;
      max-width: 100%;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 17px 17px 19px;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(125deg, #1c3470 0%, #2853b7 55%, #3c73ec 100%);
    }

    .header::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      right: -55px;
      top: -85px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 50%;
      box-shadow: 0 0 0 18px rgba(255, 255, 255, .035), 0 0 0 38px rgba(255, 255, 255, .025);
      pointer-events: none;
    }

    .header-icon {
      position: relative;
      z-index: 1;
      width: 43px;
      height: 43px;
      flex: 0 0 43px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(5, 18, 54, .2);
    }

    .header-text {
      position: relative;
      z-index: 1;
      flex: 1;
      min-width: 0;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -.2px;
      line-height: 1.35;
    }

    .header p {
      margin-top: 4px;
      color: rgba(255, 255, 255, .76);
      font-size: 11px;
      line-height: 1.4;
    }

    .header-version {
      position: relative;
      z-index: 1;
      align-self: flex-start;
      margin-top: 1px;
      padding: 3px 7px;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 20px;
      background: rgba(255, 255, 255, .12);
      color: rgba(255, 255, 255, .9);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .25px;
      white-space: nowrap;
    }

    /* ── Duration section (card) ── */
    .dur-section {
      position: relative;
      margin: 10px 12px 0;
      padding: 14px;
      border: 1px solid #bfcadb;
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .dur-label {
      margin-bottom: 5px;
      color: #53627b;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .85px;
      text-transform: uppercase;
    }

    #totalDuration {
      display: block;
      margin: 0 0 11px;
      color: var(--green);
      font-size: 32px;
      font-weight: 750;
      letter-spacing: -1px;
      line-height: 1.25;
      font-variant-numeric: tabular-nums;
    }

    .dur-sub {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
      padding: 8px 10px;
      border: 1px solid #cdd7e5;
      border-radius: 8px;
      background: var(--page);
      color: #65738a;
      font-size: 12px;
    }

    #taskCount {
      color: var(--blue);
      font-size: 12px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    #durList {
      display: block;
      width: 100%;
      min-width: 0;
      max-height: 125px;
      overflow-x: hidden;
      overflow-y: auto;
      /* Keep the scrollbar integrated with the list's right-hand border. */
      padding: 9px 12px 9px 10px;
      scrollbar-gutter: stable;
      box-sizing: border-box;
      border: 1px solid #cdd7e5;
      border-radius: 8px;
      background: var(--page);
      color: #526078;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      gap: 8px;
      padding: 12px;
    }

    button {
      min-height: 36px;
      flex: 1;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    button:focus-visible {
      outline: 3px solid rgba(53, 104, 232, .2);
      outline-offset: 2px;
    }

    #exportBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-color: #147e5a;
      background: linear-gradient(110deg, #16865f, #20a777);
      color: #fff;
      box-shadow: 0 3px 8px rgba(21, 150, 106, .16);
    }

    #exportBtn:hover {
      background: linear-gradient(110deg, #117650, #188e64);
      box-shadow: 0 4px 10px rgba(21, 150, 106, .2);
    }

    #resetBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-color: #bfcadb;
      background: #fff;
      color: #5c6a80;
    }

    #resetBtn:hover {
      border-color: #9fb0c8;
      background: #f8fafd;
    }

    /* ── Credit ── */
    .credit {
      position: relative;
      padding: 10px 12px 13px;
      color: #9aa5b5;
      font-size: 11px;
      text-align: center;
    }

    .credit a {
      color: #456bd0;
      font-weight: 700;
      text-decoration: none;
    }

    .credit a:hover {
      color: #244fb8;
      text-decoration: underline;
    }

    /* ── Scrollbar: thumb only, inset so it never touches the border/corners ── */
    #durList::-webkit-scrollbar {
      width: 10px;
      background: transparent;
    }

    #durList::-webkit-scrollbar-track,
    #durList::-webkit-scrollbar-corner {
      margin: 6px 0;
      background: transparent;
      border: 0;
    }

    #durList::-webkit-scrollbar-thumb {
      min-height: 24px;
      border: 3px solid transparent;      /* transparent frame = gap from the edges */
      border-radius: 999px;
      background: #aebbd0;
      background-clip: padding-box;
    }

    #durList::-webkit-scrollbar-thumb:hover {
      background: #879bb8;
      background-clip: padding-box;
    }

    #durList::-webkit-scrollbar-button {
      display: none;
      width: 0;
      height: 0;
    }
  </style>
</head>

<body>

  <div class="header">
    <img src="icon.jpg" alt="App Icon" class="header-icon" />
    <div class="header-text">
      <h1>Duration Counter</h1>
      <p>Counts total audio duration of tasks</p>
    </div>
    <span class="header-version">v3.1</span>
  </div>

  <div class="dur-section">
    <div class="dur-label">⏱ Total Audio Duration</div>
    <span id="totalDuration">0h 0m 0.00s</span>
    <div class="dur-sub">
      <span>Tasks counted</span>
      <span id="taskCount">0</span>
    </div>
    <div id="durList">No audio counted yet.</div>
  </div>

  <div class="btn-row">
    <button id="exportBtn" type="button"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg><span>Export (Excel)</span></button>
    <button id="resetBtn" type="button"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2m-.5-4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg><span>Reset</span></button>
  </div>

  <div class="credit">Created by <a href="https://www.linkedin.com/in/priyank0308/" target="_blank"
      rel="noopener noreferrer">Priyank Mathukiya</a>
    </div>

  <script src="xlsx.js"></script>
  <script src="popup.js"></script>
</body>

</html>
